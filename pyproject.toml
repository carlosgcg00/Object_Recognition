[project]
name = "objectrecognition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cgonzalez00", email = "cgonzalez@funditec.es" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "pip>=26.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "ultralytics>=8.4.21",
]

[project.scripts]
objectrecognition = "objectrecognition:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
